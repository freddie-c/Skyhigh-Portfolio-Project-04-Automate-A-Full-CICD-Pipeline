name: CI/CD Pipeline                                     # appears in the Actions tab and on commit status checks

on:                                                      # the trigger block - what causes this workflow to run
  push:
    branches: [main]                                     # every push to main - full pipeline, deploy included
  pull_request:
    branches: [main]                                     # PRs targeting main - gates run, deploy is skipped

permissions:                                             # least privilege; overrides the repo's default token scope
  contents: read                                         # GITHUB_TOKEN can read code and do nothing else

concurrency:                                             # stops two runs of the same branch racing each other
  group: ${{ github.workflow }}-${{ github.ref }}        # one lane per workflow + branch combination
  cancel-in-progress: true                               # a newer push cancels the older run instead of queueing

env:                                                     # workflow-level variables, visible to every job
  PYTHON_VERSION: "3.11"                                 # single source of truth; matches your venv and the image
  IMAGE_NAME: freddiec1212/full-cicd-pipeline            # Docker Hub repo; build and deploy both reference this

jobs:
  lint:                                                  # JOB 1 - runs first, gates the rest of the pipeline
    name: Lint (flake8)                                  # display name in the Actions UI
    runs-on: ubuntu-latest                               # a fresh VM for every run; no state is preserved between jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4                        # the VM starts empty; this clones your repo onto it

      - name: Set up Python
        uses: actions/setup-python@v5                    # installs a specific Python version on the runner
        with:
          python-version: ${{ env.PYTHON_VERSION }}      # reads the env block above
          cache: pip                                     # caches downloaded wheels between runs

      - name: Install lint dependencies
        run: |                                           # | is a YAML block scalar - multi-line shell script
          python -m pip install --upgrade pip            # -m pip targets THIS interpreter, not an ambient one
          python -m pip install flake8==7.1.1            # only flake8; this job needs nothing else

      - name: Run flake8
        run: flake8 .                                    # non-zero exit fails the step, the job, and the pipeline

  test:                                                  # JOB 2, runs after lint, gates deploy, and runs in a different VM
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest                               # a DIFFERENT fresh VM than the one used for lint; no state is preserved between jobs
    needs: lint                                          # QUALITY GATE - will not start unless lint succeeded
    steps:
      - name: Checkout code
        uses: actions/checkout@v4                        # New VM, empty disk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt  # -r pulls requirements.txt in too, so flask arrives

      - name: Run pytest with coverage
        run: pytest                                      # pyproject.toml supplies -v, --cov, --cov-fail-under=90

      - name: Coverage summary
        if: always()                                     # runs even when pytest failed, so you still see the number
        run: coverage report --precision=2               # reprints from the .coverage file pytest wrote

  build:                                                 # JOB 3
    name: Build & Push (Docker Hub)
    runs-on: ubuntu-latest                               # amd64 VM - the architecture mismatch starts here
    needs: test                                          # QUALITY GATE - no image is built unless all tests passed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4                        # third fresh VM, third checkout

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3                # installs CPU emulators so amd64 can build arm64 binaries

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3              # replaces the default builder with one that does multi-arch

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'          # fork PRs have no secrets; skip login rather than fail
        uses: docker/login-action@v3                     # writes credentials into the runner's docker config
        with:
          username: ${{ secrets.DOCKER_USERNAME }}       # never the literal string - always the secrets context
          password: ${{ secrets.DOCKER_PASSWORD }}       # the access token, not your account password

      - name: Build and push image
        uses: docker/build-push-action@v6                # wraps buildx; handles multi-arch and manifest lists
        with:
          context: .                                     # build context = repo root; .dockerignore prunes it
          file: ./Dockerfile                             # explicit path, so a future move breaks loudly not silently
          platforms: linux/amd64,linux/arm64             # THE FIX for arm64 - Apple Silicon node needs this
          push: ${{ github.event_name != 'pull_request' }}   # PRs build to verify, only real pushes publish
          tags: |
            ${{ env.IMAGE_NAME }}:v1.0.${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha                           # reuse layers cached by previous runs
          cache-to: type=gha,mode=max                    # save every layer, not just the final one

      - name: Report published tag
        if: github.event_name != 'pull_request'          # nothing was published on a PR, so nothing to report
        run: |
          echo "Published: ${{ env.IMAGE_NAME }}:v1.0.${{ github.run_number }}"   # visible in the job log
          echo "IMAGE_TAG=v1.0.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"   # pinned to the run summary page

  deploy:                                                # JOB 4
    name: Deploy (kind cluster)
    runs-on: [self-hosted, skyhigh-mac]                  # array = ALL labels must match; targets your Mac specifically
    needs: build                                         # QUALITY GATE - nothing deploys unless an image was published
    if: github.ref == 'refs/heads/main'                  # REQUIRED - main only; also blocks PRs from touching your laptop
    env:
      TAG: v1.0.${{ github.run_number }}                 # same tag the build job just published; single source of truth
      NS: skyhigh-cicd                                   # namespace, so no string is repeated across steps
    steps:
      - name: Checkout code
        uses: actions/checkout@v4                        # brings k8s/ manifests onto the runner

      - name: Verify cluster context
        run: |
          kubectl config use-context kind-skyhigh        # never trust ambient context - Docker Desktop steals it
          kubectl cluster-info --context kind-skyhigh    # fails loudly if the cluster is down

      - name: Apply namespace first
        run: kubectl apply -f k8s/namespace.yml --validate=strict   # must exist before anything references it

      - name: Apply manifests
        run: kubectl apply -f k8s/ --validate=strict     # Deployment + Service; idempotent, safe to re-run

      - name: Pin image tag and version
        run: |
          kubectl -n "$NS" patch deployment web --type=strategic -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"web\",\"image\":\"${{ env.IMAGE_NAME }}:${TAG}\",\"env\":[{\"name\":\"APP_VERSION\",\"value\":\"${TAG}\"}]}]}}}}"

      - name: Wait for rollout
        run: kubectl -n "$NS" rollout status deployment/web --timeout=120s   # blocks until Ready, or fails the job

      - name: Smoke test the live service
        run: |
          kubectl -n "$NS" run smoke-${{ github.run_number }} \
            --rm -i --restart=Never --image=curlimages/curl:8.10.1 \
            --command -- curl -sf --max-time 10 http://web.${NS}.svc.cluster.local/

      - name: Deployment summary
        if: always()                                     # report even on failure, so the log shows final state
        run: |
          echo "### Deployed \`${{ env.IMAGE_NAME }}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          kubectl -n "$NS" get pods -o wide >> "$GITHUB_STEP_SUMMARY"